name: tests

on:
  push:
    branches: main
  pull_request:
    branches: main
  schedule:
    # Runs every Monday at 03:00 UTC
    - cron: '0 3 * * 1'

# Cancel superseded runs when new commits are pushed to a PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest-common:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        backend: ["cpu-headless", "openvino-headless"]
    steps:
      - uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          python-version: ${{ matrix.python }}
          extras: ${{ matrix.backend }},viz,html,testing
      - name: Run unittests
        run: |
          coverage run -m pytest tests/common/ -rs ${{ (matrix.python == '3.11' && matrix.backend == 'cpu-headless') && '--memray' || '' }}
          coverage xml -o coverage-common-${{ matrix.backend }}-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-common-${{ matrix.backend }}-${{ matrix.python }}
          path: ./coverage-common-${{ matrix.backend }}-${{ matrix.python }}.xml
          if-no-files-found: error

  codecov-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ pytest-common ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: unittests
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
